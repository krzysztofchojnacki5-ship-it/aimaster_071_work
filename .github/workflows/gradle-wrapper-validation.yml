name: Gradle Wrapper Validation

on:
  push:
    branches:
      - 'work/aiforteca-*'
  pull_request:
    branches:
      - 'work/aiforteca-*'

permissions:
  contents: read

# Keep push and pull_request validation for the same head branch in one slot.
concurrency:
  group: aiforteca-wrapper-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@v4

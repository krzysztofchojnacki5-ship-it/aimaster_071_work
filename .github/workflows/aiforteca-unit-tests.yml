name: AiFORTeca Unit Tests

on:
  push:
    branches:
      - 'work/aiforteca-*'
  pull_request:
    branches:
      - 'work/aiforteca-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiforteca-unit-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: ${{ runner.os }}-android-sdk-platform-36-build-tools-36.0.0
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiforteca-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

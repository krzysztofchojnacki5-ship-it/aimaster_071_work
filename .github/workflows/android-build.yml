name: AiFORTeca Android Build

on:
  push:
    branches:
      - 'work/aiforteca-*'
  pull_request:
    branches:
      - 'work/aiforteca-*'

permissions:
  contents: read

# A push and its matching pull_request event must share one concurrency slot.
# This prevents two identical builds from occupying the Actions queue.
concurrency:
  group: aiforteca-android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper version
        run: ./gradlew --version
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiforteca-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - name: Prepare release signing
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/aiforteca-0.2-master-agent-foundation'
        env:
          AIFORTECA_KEYSTORE_BASE64: ${{ secrets.AIFORTECA_KEYSTORE_BASE64 }}
          AIFORTECA_KEYSTORE_PASSWORD: ${{ secrets.AIFORTECA_KEYSTORE_PASSWORD }}
          AIFORTECA_KEY_ALIAS: ${{ secrets.AIFORTECA_KEY_ALIAS }}
          AIFORTECA_KEY_PASSWORD: ${{ secrets.AIFORTECA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AIFORTECA_KEYSTORE_BASE64:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; producing an unsigned CI APK."
            exit 0
          fi
          for name in AIFORTECA_KEYSTORE_PASSWORD AIFORTECA_KEY_ALIAS AIFORTECA_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/aiforteca-release.jks"
          printf '%s' "$AIFORTECA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$AIFORTECA_KEYSTORE_PASSWORD" -alias "$AIFORTECA_KEY_ALIAS" >/dev/null
          echo "AIFORTECA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Assemble release APK
        env:
          AIFORTECA_KEYSTORE_PATH: ${{ steps.signing.outputs.configured == 'true' && env.AIFORTECA_KEYSTORE_PATH || '' }}
          AIFORTECA_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets.AIFORTECA_KEYSTORE_PASSWORD || '' }}
          AIFORTECA_KEY_ALIAS: ${{ steps.signing.outputs.configured == 'true' && secrets.AIFORTECA_KEY_ALIAS || '' }}
          AIFORTECA_KEY_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets.AIFORTECA_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Package source project
        run: |
          zip -r aiforteca-source-project.zip . \
            -x ".git/*" "app/build/*" ".gradle/*" "aiforteca-source-project.zip"
      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: aiforteca-source-project
          path: aiforteca-source-project.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload signed release APK
        if: success() && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aiforteca-release-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        if: success() && steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aiforteca-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

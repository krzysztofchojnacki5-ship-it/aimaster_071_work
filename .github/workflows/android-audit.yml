name: Android audit

on:
  push:
    branches:
      - audit/0.6.137-routing-hardening
      - audit/0.6.140-chat-history-restore
      - audit/0.6.141-navigation-atomicity
      - audit/0.6.142-new-chat-atomicity
      - audit/0.6.143-delete-current-chat
      - audit/0.6.144-chat-pins-durability
      - audit/0.6.145-chat-restore-atomicity
      - audit/0.6.146-startup-chat-snapshot
      - audit/0.6.147-startup-restore-nullability
    paths-ignore:
      - '**/*.md'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-compile:
    name: Unit tests and debug compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and compile debug variant
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-audit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

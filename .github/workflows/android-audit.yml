name: Android audit

on:
  push:
    branches:
      - audit/0.6.137-routing-hardening
      - audit/0.6.140-chat-history-restore
      - audit/0.6.141-navigation-atomicity
      - audit/0.6.142-new-chat-atomicity
      - audit/0.6.143-delete-current-chat
      - audit/0.6.144-chat-pins-durability
      - audit/0.6.145-chat-pins-durability
      - audit/0.6.146-startup-chat-snapshot
      - audit/0.6.147-startup-restore-nullability
      - audit/0.6.148-agent-activity-refresh
      - audit/0.6.149-single-chat-snapshot
      - build/WB-007-android-apk-pipeline
    paths-ignore:
      - '**/*.md'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-compile:
    name: Unit tests and debug compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The wrapper JAR is pinned to the reviewed official Gradle v8.13.0 source artifact.
      # setup-gradle's built-in allowlist does not yet recognize this generated JAR hash.
      - name: Verify pinned Gradle Wrapper JAR
        run: |
          echo "b3b3569a02c00109579a298de81226df60f9cf070aab764f3b9948cef17f1d95  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      # This action configures Gradle caching; the committed wrapper controls the Gradle version.
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify Gradle Wrapper version
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and record SHA-256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-audit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
